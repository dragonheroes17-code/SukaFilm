<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suka Film</title>

<style>

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
text-align:center;
}

/* HEADER */

.header{
padding:15px;
background:#111;
font-size:20px;
font-weight:bold;
}

/* TITLE */

.video-title{
padding:10px;
font-size:18px;
}

/* PLAYER */

.player-box{
width:95%;
max-width:900px;
margin:auto;
}

iframe{
width:100%;
height:55vh;
border:none;
border-radius:8px;
background:#000;
}

/* SERVER BUTTON */

.servers{
margin-top:12px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
}

.servers button{
background:#222;
border:none;
color:white;
padding:10px 16px;
border-radius:6px;
cursor:pointer;
font-size:14px;
}

.servers button.active{
background:red;
}

/* DOWNLOAD */

.download{
margin-top:15px;
}

.download button{
background:red;
border:none;
color:white;
padding:12px 24px;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

/* ADS */

.ads{
margin-top:20px;
display:flex;
justify-content:center;
}

</style>
</head>

<body>

<!-- POPUNDER ADS -->
<script src="https://pl28689674.effectivegatecpm.com/ff/55/77/ff5577d8518b78b53e2583db39c0880f.js"></script>

<div class="header">🎬 Suka Film</div>

<div class="video-title" id="title">Loading...</div>

<div class="player-box">

<iframe id="player"></iframe>

<div class="servers" id="servers"></div>

<div class="download">
<button id="downloadBtn">⬇ Download Video</button>
</div>

</div>

<!-- BANNER ADS -->

<div class="ads">

<script>
atOptions = {
'key' : '918a03189f43a50d0c498f0fe27c8fd1',
'format' : 'iframe',
'height' : 250,
'width' : 300,
'params' : {}
};
</script>

<script src="https://www.highperformanceformat.com/918a03189f43a50d0c498f0fe27c8fd1/invoke.js"></script>

</div>

<script>

const params = new URLSearchParams(location.search);
const id = params.get("id");

let videoData;

fetch("videos.json")
.then(res=>res.json())
.then(data=>{

videoData = data.find(v => v.id === id);

if(!videoData){
document.getElementById("title").innerText="Video tidak ditemukan";
return;
}

document.getElementById("title").innerText = videoData.title;

createServers();

loadServer(0);

document.getElementById("downloadBtn").onclick = ()=>{
window.open(videoData.download);
};

});

function loadServer(i){

document.getElementById("player").src = videoData.servers[i].url;

document.querySelectorAll(".servers button")
.forEach(b=>b.classList.remove("active"));

document.querySelectorAll(".servers button")[i]
.classList.add("active");

}

function createServers(){

const box = document.getElementById("servers");

box.innerHTML="";

videoData.servers.forEach((s,i)=>{

box.innerHTML += `
<button onclick="loadServer(${i})" ${i==0?'class="active"':''}>
${s.name}
</button>
`;

});

}

</script>

</body>
</html>
