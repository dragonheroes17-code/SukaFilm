<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player - Suka Film</title>

<style>

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
text-align:center;
}

/* HEADER */

.header{
padding:15px;
background:#111;
font-size:20px;
font-weight:bold;
}

/* TITLE */

.video-title{
padding:10px;
font-size:16px;
}

/* PLAYER */

.player-box{
width:95%;
max-width:900px;
margin:auto;
}

iframe{
width:100%;
height:55vh;
border:none;
border-radius:8px;
background:#000;
}

/* SERVER BUTTON */

.servers{
margin-top:10px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:8px;
}

.servers button{
background:#222;
border:none;
color:white;
padding:8px 14px;
border-radius:6px;
cursor:pointer;
}

.servers button.active{
background:red;
}

/* DOWNLOAD */

.download{
margin-top:12px;
}

.download button{
background:red;
border:none;
color:white;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- POPUNDER ADS -->
<script src="https://pl28689674.effectivegatecpm.com/ff/55/77/ff5577d8518b78b53e2583db39c0880f.js"></script>

<div class="header">🎬 Suka Film</div>

<div class="video-title" id="title">Loading...</div>

<div class="player-box">

<iframe id="player"></iframe>

<div class="servers" id="servers"></div>

<div class="download">
<button id="downloadBtn">⬇ Download</button>
</div>

</div>

<script>

const params = new URLSearchParams(location.search);
const id = params.get("id");

let videoData;

fetch("videos.json")
.then(res=>res.json())
.then(data=>{

videoData = data.find(v => v.id === id);

document.getElementById("title").innerText = videoData.title;

loadServer(0);

createServers();

document.getElementById("downloadBtn").onclick = ()=>{
window.open(videoData.download);
};

});

function loadServer(i){

document.getElementById("player").src =
videoData.servers[i].url;

document.querySelectorAll(".servers button")
.forEach(b=>b.classList.remove("active"));

document.querySelectorAll(".servers button")[i]
.classList.add("active");

}

function createServers(){

const box = document.getElementById("servers");

videoData.servers.forEach((s,i)=>{

box.innerHTML += `
<button onclick="loadServer(${i})">
${s.name}
</button>
`;

});

}

</script>

</body>
</html>
