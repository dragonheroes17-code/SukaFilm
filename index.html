<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suka Short</title>

<style>
body{
margin:0;
background:#000;
font-family:sans-serif;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}

.videoBox{
height:100vh;
scroll-snap-align:start;
position:relative;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.title{
position:absolute;
bottom:80px;
left:15px;
color:white;
font-size:18px;
font-weight:bold;
text-shadow:0 0 5px black;
}

</style>
</head>

<body>

<!-- POPUNDER ADS -->
<script src="https://pl28689674.effectivegatecpm.com/ff/55/77/ff5577d8518b78b53e2583db39c0880f.js"></script>

<div id="feed"></div>

<script>

const DATA_URL="https://raw.githubusercontent.com/dragonheroes17-code/SukaFilm/main/shorts.json";

async function loadShorts(){

const res=await fetch(DATA_URL);
const shorts=await res.json();

const feed=document.getElementById("feed");

shorts.forEach(v=>{

const box=document.createElement("div");
box.className="videoBox";

box.innerHTML=`
<video muted loop playsinline preload="none">
<source src="${v.video}" type="video/mp4">
</video>

<div class="title">${v.title}</div>
`;

feed.appendChild(box);

});

autoPlay();

}

function autoPlay(){

const videos=document.querySelectorAll("video");

const observer=new IntersectionObserver(entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){
entry.target.play();
}else{
entry.target.pause();
}

});

},{threshold:0.7});

videos.forEach(v=>observer.observe(v));

}

loadShorts();

</script>

</body>
</html>
