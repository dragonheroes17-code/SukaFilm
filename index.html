<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suka Film</title>

<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
header{padding:15px;text-align:center;background:#111;font-size:22px}

.tabs{
display:flex;
gap:10px;
overflow:auto;
padding:10px;
}

.tabs button{
background:#222;
border:none;
color:white;
padding:8px 14px;
border-radius:20px;
}

.tabs button.active{background:red}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:15px;
padding:15px;
}

.card{cursor:pointer;background:#111;border-radius:10px;overflow:hidden}
.card img{width:100%;height:200px;object-fit:cover}
.title{padding:8px;text-align:center;font-size:14px}
</style>
</head>

<body>

<header>🎬 Suka Film</header>

<div class="tabs">
<button onclick="setCat('all',this)" class="active">Semua</button>
<button onclick="setCat('jav',this)">JAV</button>
<button onclick="setCat('cosplayer',this)">Cosplayer</button>
<button onclick="setCat('short',this)">Short Video</button>
</div>

<div id="grid" class="grid"></div>

<script>

const DATA="videos.json";
let videos=[];
let category="all";

async function load(){
const res=await fetch(DATA);
videos=await res.json();
render();
}

function render(){
const grid=document.getElementById("grid");
grid.innerHTML="";

videos
.filter(v=>category==="all"||v.category===category)
.forEach(v=>{

grid.innerHTML+=`
<div class="card"
onclick="location.href='player.html?id=${v.id}'">

<img src="${v.thumb}">
<div class="title">${v.title}</div>

</div>`;
});
}

function setCat(c,btn){
category=c;
document.querySelectorAll('.tabs button')
.forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
render();
}

load();

</script>

</body>
</html>
