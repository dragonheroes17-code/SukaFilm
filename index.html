<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suka Film</title>

<style>
body{margin:0;font-family:Arial;background:#000;color:#fff}
header{padding:16px;text-align:center;font-size:22px;background:#111}

.ads-top,.ads-bottom{text-align:center;padding:12px}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
gap:14px;
padding:14px;
}

.card{
background:#111;
border-radius:12px;
overflow:hidden;
cursor:pointer;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.title{
padding:8px;
text-align:center;
font-size:14px;
}

.player{
position:fixed;
inset:0;
background:#000;
display:none;
flex-direction:column;
z-index:999;
}

.player iframe{
width:100%;
height:80vh;
border:none;
}

.controls{
text-align:center;
padding:10px;
}

.controls button{
margin:5px;
padding:10px 14px;
border:none;
border-radius:8px;
background:red;
color:#fff;
}
</style>
</head>

<body>

<header>🎬 Suka Film</header>

<!-- POPUNDER -->
<script src="https://pl28689674.effectivegatecpm.com/ff/55/77/ff5577d8518b78b53e2583db39c0880f.js"></script>

<!-- IKLAN ATAS -->
<div class="ads-top">
<script>
atOptions={'key':'918a03189f43a50d0c498f0fe27c8fd1','format':'iframe','height':250,'width':300,'params':{}};
</script>
<script src="https://www.highperformanceformat.com/918a03189f43a50d0c498f0fe27c8fd1/invoke.js"></script>
</div>

<div id="grid" class="grid">Loading...</div>

<!-- IKLAN BAWAH -->
<div class="ads-bottom">
<script>
atOptions={'key':'918a03189f43a50d0c498f0fe27c8fd1','format':'iframe','height':250,'width':300,'params':{}};
</script>
<script src="https://www.highperformanceformat.com/918a03189f43a50d0c498f0fe27c8fd1/invoke.js"></script>
</div>

<!-- PLAYER -->
<div class="player" id="player">

<iframe id="video"></iframe>

<div class="controls" id="servers"></div>

<div class="controls">
<button onclick="closePlayer()">Tutup</button>
</div>

</div>

<script>

const DATA_URL="https://raw.githubusercontent.com/dragonheroes17-code/SukaFilm/main/videos.json";

let videos=[];
let currentVideo=null;

async function loadVideos(){
const res=await fetch(DATA_URL);
videos=await res.json();
render();
}

function render(){
const grid=document.getElementById("grid");
grid.innerHTML="";

videos.forEach((v,i)=>{
const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${v.thumb}">
<div class="title">${v.title}</div>
`;

div.onclick=()=>openPlayer(i);

grid.appendChild(div);
});
}

function openPlayer(i){
currentVideo=videos[i];
document.getElementById("player").style.display="flex";
loadServer(0);
}

function loadServer(index){
document.getElementById("video").src=currentVideo.servers[index].url;
renderServers(index);
}

function renderServers(active){
const box=document.getElementById("servers");
box.innerHTML="";

currentVideo.servers.forEach((s,i)=>{
box.innerHTML+=`
<button onclick="loadServer(${i})"
style="background:${i==active?'green':'red'}">
${s.name}
</button>`;
});
}

function closePlayer(){
document.getElementById("player").style.display="none";
document.getElementById("video").src="";
}

loadVideos();

</script>

</body>
</html>
