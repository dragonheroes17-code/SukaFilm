<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Suka Film</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #111;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .search input {
            padding: 8px 14px;
            border-radius: 20px;
            border: none;
            background: #222;
            color: white;
            outline: none;
        }

        /* TAB */
        .tabs {
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            background: #0d0d0d;
            overflow: auto;
            scrollbar-width: none; /* Menyembunyikan scrollbar di Firefox */
        }
        
        .tabs::-webkit-scrollbar {
            display: none; /* Menyembunyikan scrollbar di Chrome/Safari */
        }

        .tabs button {
            background: #222;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tabs button.active {
            background: red;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 15px;
        }

        .card {
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .card:hover {
            transform: scale(1.02);
        }

        .card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
        }

        .title {
            padding: 6px;
            font-size: 12px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>

    <script src="https://pl28689674.effectivegatecpm.com/ff/55/77/ff5577d8518b78b53e2583db39c0880f.js"></script>

    <div class="header">
        <div class="logo">🎬 Suka Film</div>
        <div class="search">
            <input type="text" id="search" placeholder="Cari..." oninput="render()">
        </div>
    </div>

    <div class="tabs">
        <button onclick="setCat('all', this)" class="active">Semua</button>
        <button onclick="setCat('jav', this)">JAV</button>
        <button onclick="setCat('cosplayer', this)">Cosplayer</button>
        <button onclick="setCat('short', this)">Short</button>
    </div>

    <div style="text-align: center; padding: 10px;">
        <script>
            atOptions = {
                'key': '918a03189f43a50d0c498f0fe27c8fd1',
                'format': 'iframe',
                'height': 250,
                'width': 300,
                'params': {}
            };
        </script>
        <script src="https://www.highperformanceformat.com/918a03189f43a50d0c498f0fe27c8fd1/invoke.js"></script>
    </div>

    <div id="grid" class="grid"></div>

    <script>
        const DATA = "videos.json";
        let videos = [];
        let category = "all";

        // Fungsi mengambil data
        async function load() {
            try {
                const res = await fetch(DATA);
                if (!res.ok) throw new Error("Gagal mengambil data JSON");
                
                videos = await res.json();
                render();
            } catch (error) {
                console.error("Error memuat video:", error);
                document.getElementById("grid").innerHTML = `
                    <p style="grid-column: 1/-1; text-align: center; color: #ff4444; padding: 20px;">
                        ⚠️ Gagal memuat daftar video.<br>Pastikan file <b>${DATA}</b> sudah di-upload.
                    </p>
                `;
            }
        }

        // Fungsi menampilkan grid video
        function render() {
            const keyword = document.getElementById("search").value.toLowerCase();
            const grid = document.getElementById("grid");
            
            const filtered = videos.filter(v =>
                (category === "all" || v.category === category) &&
                v.title.toLowerCase().includes(keyword)
            );

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #888;">Video tidak ditemukan.</p>`;
                return;
            }

            // Render menggunakan map().join() agar lebih ringan
            grid.innerHTML = filtered.map(v => `
                <div class="card" onclick="openVideo('${v.id}')">
                    <img src="${v.thumb}" alt="${v.title}" loading="lazy">
                    <div class="title" title="${v.title}">${v.title}</div>
                </div>
            `).join('');
        }

        // Fungsi ganti kategori
        function setCat(c, btn) {
            category = c;
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        // Fungsi klik video & buka iklan
        function openVideo(id) {
            window.open("https://www.effectivegatecpm.com/nmgdiyzvqf?key=6ace03870e7e2249b2df84f18104939d", "_blank");
            
            setTimeout(() => {
                location.href = "player.html?id=" + id;
            }, 800);
        }

        // Eksekusi pertama kali web dibuka
        load();
    </script>

</body>
</html>
